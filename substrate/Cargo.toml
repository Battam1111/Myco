[package]
name = "myco-substrate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Myco v0.9 substrate daemon binary (L4 M6). Listens on stdio for operator requests (e.g. from operators/claude), drives the metabolic cycle, and orchestrates the Python kernel/tropism worker via the kernel/bridge/rust M5 protocol."

[[bin]]
name = "myco-substrate"
path = "src/main.rs"

[lib]
name = "substrate"
path = "src/lib.rs"

[lints.clippy]
all = { level = "warn", priority = -1 }
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"

[dependencies]
myco-kernel-shared = { path = "../kernel/shared" }
myco-kernel-bridge = { path = "../kernel/bridge/rust" }
myco-kernel-continuity = { path = "../kernel/continuity" }
myco-kernel-schema = { path = "../kernel/schema" }
thiserror.workspace = true
sha2.workspace = true
blake3.workspace = true

# **v3.1.1 Sprint 2** — Windows DPAPI sealing for substrate_signing_key.cb.
# Per L1/SKIN §4.2 + L1/HARD_RULES C4: substrate_secret MUST be sealed at
# rest. Windows DPAPI (CryptProtectData) binds the seed to the current user
# account such that filesystem-read attacks cannot extract the plaintext seed
# without compromising the same user's login. Tier-1 production-blocking gap
# pre-Sprint 2 — without this, owner-key custody on Windows degrades to
# "anyone who can read C:\Users\<owner>\.myco\substrate\state\substrate_signing_key.cb".
#
# Cross-platform footprint: this dependency is gated to Windows targets only;
# Linux/Mac builds skip it entirely (their respective OS-sealing backends
# — TPM / keyring / Secure Enclave — are scheduled for follow-up sprints).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }

[dev-dependencies]
