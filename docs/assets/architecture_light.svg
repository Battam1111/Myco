<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <!-- Cultivator -->
  <rect x="290" y="22" width="200" height="48" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="390" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Cultivator</text>
  <text x="390" y="61" text-anchor="middle" font-size="11" fill="#57606a">one human · for decades</text>

  <line x1="390" y1="70" x2="390" y2="92" stroke="#8c959f" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="400" y="86" font-size="10" fill="#57606a">talks · MCP</text>

  <!-- Claude -->
  <rect x="290" y="94" width="200" height="48" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="390" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Claude</text>
  <text x="390" y="133" text-anchor="middle" font-size="11" fill="#57606a">swappable agent · any model</text>

  <line x1="390" y1="142" x2="390" y2="164" stroke="#8c959f" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Operator -->
  <rect x="290" y="166" width="200" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="390" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">Operator</text>
  <text x="390" y="201" text-anchor="middle" font-size="11" fill="#57606a">MCP server · TypeScript</text>

  <line x1="390" y1="210" x2="390" y2="232" stroke="#8c959f" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Core: substrate + kernel -->
  <rect x="180" y="234" width="420" height="120" rx="10" fill="#ffffff" stroke="#007A63" stroke-width="1.6"/>
  <text x="390" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#007A63">SUBSTRATE · Rust</text>
  <text x="390" y="280" text-anchor="middle" font-size="11" fill="#57606a">DAG · content-address · seal · immune system</text>
  <line x1="202" y1="294" x2="578" y2="294" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <text x="390" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#007A63">KERNEL · Python</text>
  <text x="390" y="336" text-anchor="middle" font-size="11" fill="#57606a">tropism · governance · trajectory</text>

  <!-- Anchor -->
  <rect x="628" y="262" width="134" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="695" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Anchor</text>
  <text x="695" y="305" text-anchor="middle" font-size="10" fill="#57606a">owner key, held</text>
  <text x="695" y="318" text-anchor="middle" font-size="10" fill="#57606a">outside the operator</text>
  <line x1="600" y1="294" x2="628" y2="294" stroke="#8c959f" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <line x1="390" y1="354" x2="390" y2="376" stroke="#8c959f" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Metabolism band -->
  <rect x="180" y="378" width="420" height="50" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="390" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Ingest → Cycle → Prune → Evolve</text>
  <text x="390" y="417" text-anchor="middle" font-size="10.5" fill="#57606a">the metabolism, running between your turns</text>

  <!-- Doctrine footer -->
  <text x="390" y="452" text-anchor="middle" font-size="10.5" fill="#57606a">Doctrine · A spec · B image · C witness tests · D succession · plus the running conversation</text>
</svg>
